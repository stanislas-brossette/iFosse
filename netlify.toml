[build]
command = "npm run typecheck && npm run lint && npm test && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# Set all public VITE_* variables explicitly in Netlify per site/context.
# Netlify's production context also serves the staging site's primary branch;
# VITE_APP_ENV is therefore supplied by site configuration, never inferred here.
# Preview/branch deploys use staging Supabase. No service-role keys in builds.

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
