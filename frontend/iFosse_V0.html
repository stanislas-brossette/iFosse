    const adminAttention=`${pending>0?`<div class="insight"><div class="insight-mark">${icon('users')}</div><div><h4>${pending} inscrit${pending>1?'s':''} à confirmer</h4><p>${c.yes} personnes ont répondu oui pour ${next.capacity} places le ${h(fmtDate(next.date))}.</p><button class="text-btn mt8" data-action="navigate" data-route="session/${next.id}/manage">Préparer la sélection ${icon('arrow')}</button></div></div>`:''}<div class="insight"><div class="insight-mark teal">${icon('car')}</div><div><h4>${needRide} trajet${needRide>1?'s':''} à organiser</h4><p>Une place dans une voiture peut faire la différence.</p><button class="text-btn mt8" data-action="navigate" data-route="session/${next.id}/transport">Organiser le covoiturage ${icon('arrow')}</button></div></div>${estimated.length?`<div class="insight"><div class="insight-mark blue">${icon('clock')}</div><div><h4>${estimated.length} horaires de fin à confirmer</h4><p>Le calendrier fourni est tronqué pour certaines séances.</p><button class="text-btn mt8" data-action="navigate" data-route="session/${estimated[0].id}/overview">Vérifier les horaires ${icon('arrow')}</button></div></div>`:''}`;
    let memberAttention='';
    if(mine.rsvp==='unanswered')memberAttention+=`<div class="insight"><div class="insight-mark">${icon('calendar')}</div><div><h4>Votre réponse est attendue</h4><p>Indiquez si vous serez présent à la prochaine fosse.</p><button class="text-btn mt8" data-action="navigate" data-route="session/${next.id}/overview">Répondre maintenant ${icon('arrow')}</button></div></div>`;
    else if(mine.rsvp==='yes'&&mySelection==='selected')memberAttention+=`<div class="insight"><div class="insight-mark teal">${icon('check')}</div><div><h4>Votre place est confirmée</h4><p>Vous faites partie de la sélection publiée pour cette fosse.</p><button class="text-btn mt8" data-action="navigate" data-route="session/${next.id}/overview">Voir ma participation ${icon('arrow')}</button></div></div>`;
    else if(mine.rsvp==='yes')memberAttention+=`<div class="insight"><div class="insight-mark">${icon('clock')}</div><div><h4>Votre demande est enregistrée</h4><p>${next.publishedAt?'Votre place n\u2019est pas confirm\u00e9e dans la s\u00e9lection publi\u00e9e.':'La s\u00e9lection des participants n\u2019a pas encore été publiée.'}</p><button class="text-btn mt8" data-action="navigate" data-route="session/${next.id}/overview">Voir ma participation ${icon('arrow')}</button></div></div>`;
    if(mine.rsvp==='yes'&&['needs','unset'].includes(mine.transportMode))memberAttention+=`<div class="insight"><div class="insight-mark teal">${icon('car')}</div><div><h4>Votre trajet reste à organiser</h4><p>Choisissez une voiture, proposez la vôtre ou indiquez que vous êtes autonome.</p><button class="text-btn mt8" data-action="navigate" data-route="session/${next.id}/transport">Organiser mon trajet ${icon('arrow')}</button></div></div>`;
    if(mine.rsvp==='yes'&&mySelection==='selected'&&mine.payment==='unpaid')memberAttention+=`<div class="insight"><div class="insight-mark blue">${icon('euro')}</div><div><h4>Paiement à régler</h4><p>Votre statut de paiement est actuellement « À régler ».</p><button class="text-btn mt8" data-action="navigate" data-route="session/${next.id}/overview">Voir mon statut ${icon('arrow')}</button></div></div>`;
    if(!memberAttention)memberAttention=`<div class="insight"><div class="insight-mark teal">${icon('check')}</div><div><h4>Tout est à jour</h4><p>Vous n’avez rien à faire pour la prochaine fosse pour le moment.</p></div></div>`;
    return `<div class="page-heading"><div><div class="eyebrow">Saison ${seasonLabel(ui.season)}</div><h1>Bonjour ${h(me().firstName)}.</h1><p>Votre prochaine immersion commence ici.</p></div>${isAdmin()?`<button class="btn primary" data-action="edit-session">${icon('plus')}Nouvelle séance</button>`:seasonSelect()}</div><div class="home-grid"><section class="card hero"><div class="hero-art" aria-hidden="true"><i class="orb"></i><i class="orb"></i><i class="orb"></i><i class="bubble"></i><i class="bubble b2"></i><i class="bubble b3"></i></div><div class="hero-content"><div class="row between"><span class="eyebrow">Prochaine fosse · ${days?'Dans '+days+' jours':'Aujourd’hui'}</span>${badge(next.registrationOpen?'Inscriptions ouvertes':'Inscriptions fermées','dark')}</div><h2>${h(cap(fmtDate(next.date,{weekday:'long',day:'numeric',month:'long'})))}</h2><div class="meta"><span class="row gap6">${icon('clock')}${fmtTime(next.start)} — ${fmtTime(next.end)}</span><span class="row gap6">${icon('location')}${h(next.venue)}</span></div></div><div class="hero-footer"><button class="btn white" data-action="navigate" data-route="session/${next.id}/overview">Voir la séance ${icon('arrow')}</button><div class="hero-caption">${c.yes} oui · ${c.maybe} peut-être<br><span style="display:block;margin-top:5px">${c.selected} places confirmées / ${next.capacity}</span></div></div></section>${participationCard(next)}</div><div class="stats-grid"><div class="card stat"><div class="stat-icon">${icon('calendar')}</div><div><strong>${upcoming.length}</strong><div class="label">Fosses à venir</div></div></div><div class="card stat"><div class="stat-icon blue">${icon('wave')}</div><div><strong>${myCount}<span class="unit">plongée${myCount>1?'s':''}</span></strong><div class="label">Mes fosses cette saison</div></div></div>${isAdmin()?`<div class="card stat"><div class="stat-icon sand">${icon('users')}</div><div><strong>${db.members.length}</strong><div class="label">Adhérents au club</div></div></div>`:''}</div><div class="home-lower"><section class="card pad"><div class="card-heading"><h2>Les prochains rendez-vous</h2><button class="text-btn" data-action="navigate" data-route="sessions">Tout voir ${icon('arrow')}</button></div>${upcoming.slice(1,5).map(s=>`<div class="session-row">${dateTile(s)}<div class="grow"><div class="session-row-title">${h(cap(fmtDate(s.date,{weekday:'long',day:'numeric',month:'long'})))}</div><div class="meta">${fmtTime(s.start)} — ${fmtTime(s.end)}${s.endEstimated?' *':''} · ${counts(s).yes} inscrits</div></div>${rsvpBadge(M.response(s,ui.actor).rsvp)}<button class="btn small" data-action="navigate" data-route="session/${s.id}/overview" aria-label="Voir la séance du ${h(fmtDate(s.date))}">${icon('chevron')}</button></div>`).join('')||'<p class="muted small">C\u2019est la derni\u00e8re s\u00e9ance de cette saison.</p>'}</section><section class="card pad"><div class="card-heading"><h2>${isAdmin()?'À garder en vue':'Pour moi'}</h2>${icon('eye')}</div>${isAdmin()?adminAttention:memberAttention}<div class="season-note">Une saison, de septembre à août.<br>Seules les plongées réellement effectuées et les bilans clôturés alimentent les compteurs.</div></section></div>`;
  }
  function sessionCard(s){const c=counts(s),mine=M.response(s,ui.actor);return `<article class="card session-card"><div class="row between">${dateTile(s)}${s.demoHistory?badge('Exemple fictif','blue'):s.status==='closed'?badge('Bilan cl\u00f4tur\u00e9','green'):s.endEstimated?badge('Fin \u00e0 confirmer','amber','clock'):badge(s.registrationOpen?'Inscriptions ouvertes':'Inscriptions ferm\u00e9es',s.registrationOpen?'teal':'')}</div><h3>${h(cap(fmtDate(s.date,{weekday:'long',day:'numeric',month:'long'})))}</h3><div class="meta">${icon('clock')}${fmtTime(s.start)} \u2014 ${fmtTime(s.end)}${s.endEstimated?' *':''}</div><div class="meta mt8">${icon('location')}${h(s.venue||'Lieu \u00e0 pr\u00e9ciser')}</div><div class="capacity-label"><span><b>${c.selected} / ${s.capacity}</b> places confirm\u00e9es</span><span>${c.yes} oui</span></div><div class="progress" aria-label="${c.selected} places confirm\u00e9es sur ${s.capacity}"><i style="width:${Math.min(100,100*c.selected/s.capacity)}%"></i></div><div class="my-status row between"><span>Ma r\u00e9ponse</span>${rsvpBadge(mine.rsvp)}</div><div class="session-card-bottom row between">${avatars(M.selectedIds(s).length?M.selectedIds(s):Object.keys(s.responses).filter(id=>s.responses[id].rsvp==='yes'),4)}<button class="text-btn" data-action="navigate" data-route="session/${s.id}/overview">Voir la s\u00e9ance ${icon('arrow')}</button></div></article>`;}
  function sessions(){const all=getSeasonSessions(),upcoming=all.filter(s=>!M.isPast(s)&&s.status!=='closed'),past=all.filter(s=>M.isPast(s)||s.status==='closed');let shown=ui.sessionFilter==='upcoming'?upcoming:ui.sessionFilter==='past'?past.slice().reverse():all;return `<div class="page-heading"><div><div class="eyebrow">Le calendrier du club</div><h1>Les s\u00e9ances</h1><p>Des rendez-vous partag\u00e9s, du premier oui au dernier plongeon.</p></div>${isAdmin()?`<button class="btn primary" data-action="edit-session">${icon('plus')}Nouvelle s\u00e9ance</button>`:''}</div><div class="toolbar"><div class="segmented" role="group" aria-label="P\u00e9riode">${[['upcoming','\u00c0 venir',upcoming.length],['past','Termin\u00e9es',past.length],['all','Toutes',all.length]].map(([v,l,n])=>`<button class="${ui.sessionFilter===v?'active':''}" data-action="session-filter" data-value="${v}" aria-pressed="${ui.sessionFilter===v}">${h(l)}<span class="count">${n}</span></button>`).join('')}</div>${seasonSelect()}</div>${shown.some(s=>s.demoHistory)?`<div class="banner info">${icon('help')}<span>Les deux s\u00e9ances de septembre sont des exemples fictifs pour tester l\u2019historique. Les 11 autres dates proviennent du calendrier fourni.</span></div>`:''}${shown.length?`<div class="session-grid">${shown.map(sessionCard).join('')}</div>`:`<div class="card empty"><div class="empty-icon">${icon('calendar')}</div><h3>Aucune s\u00e9ance ici pour le moment</h3><p>Changez de p\u00e9riode ou de saison pour retrouver les autres rendez-vous.</p></div>`}`;}
  function sessionPage(s,tab){

    return `<button class="text-btn back-btn" data-action="navigate" data-route="sessions">${icon('back')}Toutes les s\u00e9ances</button><div class="page-heading session-heading"><div><div class="row gap8 mb16">${s.status==='closed'?badge('Bilan cl\u00f4tur\u00e9','green','check'):badge(s.registrationOpen?'Inscriptions ouvertes':'Inscriptions ferm\u00e9es',s.registrationOpen?'teal':'')}${s.demoHistory?badge('Exemple fictif','blue'):''}<span class="tiny muted">Saison ${seasonLabel(M.seasonOf(s.date))}</span></div><h1>Fosse du ${h(fmtDate(s.date))}</h1><div class="meta-line"><span>${icon('calendar')}${h(cap(fmtDate(s.date,{weekday:'long',year:'numeric',month:'long',day:'numeric'})))}</span><span>${icon('clock')}${fmtTime(s.start)} \u2014 ${fmtTime(s.end)}</span><span>${icon('location')}${h(s.venue||'Lieu \u00e0 pr\u00e9ciser')}</span></div></div><div class="row header-actions gap8"><button class="btn" data-action="calendar" data-sid="${s.id}">${icon('calendar')}Mon agenda</button>${isAdmin()?`<button class="btn primary" data-action="edit-session" data-sid="${s.id}">${icon('edit')}Modifier</button>`:''}</div></div>${s.endEstimated?`<div class="banner">${icon('clock')}<span><strong>Heure de fin \u00e0 confirmer.</strong> La capture fournie ne montre pas la fin de ce cr\u00e9neau. Une dur\u00e9e de 1 h est utilis\u00e9e provisoirement (${fmtTime(s.start)}\u2013${fmtTime(s.end)}).</span></div>`:''}<nav class="tabs" aria-label="Rubriques de la s\u00e9ance">${tabs.map(([key,label,sym,count])=>`<button class="tab ${tab===key?'active':''}" data-action="navigate" data-route="session/${s.id}/${key}" ${tab===key?'aria-current="page"':''}>${icon(sym)}${h(label)}${count!==''?`<span class="tab-count">${count}</span>`:''}</button>`).join('')}</nav>${tab==='participants'?participantsView(s):tab==='transport'?transportView(s):tab==='groups'?groupsView(s):tab==='manage'?manageView(s):overviewView(s)}`;
  }
  function overviewView(s){const c=counts(s),r=M.response(s,ui.actor),selected=M.selectedIds(s);return `<div class="detail-grid"><div class="stack">${participationCard(s)}<section class="card pad"><div class="card-heading"><h2>Informations pratiques</h2>${icon('location')}</div><div class="info-row">${icon('location')}<div><div class="label">Le rendez-vous</div><p>${h(s.venue||'Lieu \u00e0 pr\u00e9ciser')}</p><p class="muted small">${h(s.address||'Adresse exacte \u00e0 compl\u00e9ter par le club.')}</p></div></div><div class="info-row">${icon('clock')}<div><div class="label">Le cr\u00e9neau \u00b7 heure de Paris</div><p>${fmtTime(s.start)} \u2014 ${fmtTime(s.end)}${s.endEstimated?' (fin estim\u00e9e)':''}</p></div></div><div class="info-row">${icon('users')}<div><div class="label">La capacit\u00e9</div><p>${s.capacity} places, encadrants compris.</p><p class="small muted">Les r\u00e9ponses \u00ab Oui \u00bb ne sont pas limit\u00e9es. La s\u00e9lection finale l\u2019est.</p></div></div>${s.notes?`<div class="info-row">${icon('book')}<div><div class="label">Les infos du club</div><p style="white-space:pre-line">${h(s.notes)}</p></div></div>`:''}</section></div><div class="stack"><section class="card pad"><div class="card-heading"><h2>Les places dans la fosse</h2>${badge(s.publishedAt?'S\u00e9lection publi\u00e9e':'Non publi\u00e9e',s.publishedAt?'teal':'')}</div><div class="big-number">${c.selected}<span> / ${s.capacity}</span></div><p class="tiny muted mt8">participants confirm\u00e9s, encadrants inclus</p><div class="progress mt16"><i style="width:${100*c.selected/s.capacity}%"></i></div><div class="mini-stats"><div><b>${c.yes}</b><span>R\u00e9ponses oui</span></div><div><b>${c.maybe}</b><span>Peut-\u00eatre</span></div><div><b>${s.capacity-c.selected}</b><span>Places \u00e0 attribuer</span></div></div>${selected.length?avatars(selected,7):''}<p class="tiny muted mt16">${s.publishedAt?'Derni\u00e8re publication : '+h(fmtStamp(s.publishedAt))+'.':'Aucune s\u00e9lection publi\u00e9e pour le moment.'}</p>${isAdmin()&&M.draftChanges(s)?`<div class="banner mt16">${icon('edit')}<span>${M.draftChanges(s)} modification(s) en brouillon, invisibles aux adh\u00e9rents.</span></div>`:''}<button class="btn ${isAdmin()?'primary':'soft'} mt16" style="width:100%" data-action="navigate" data-route="session/${s.id}/${isAdmin()?'manage':'participants'}">${icon(isAdmin()?'users':'eye')}${isAdmin()?'Pr\u00e9parer la s\u00e9lection':'Voir tous les participants'}</button></section><section class="card pad"><div class="card-heading"><h2>Mon paiement</h2>${icon('euro')}</div><div class="row between"><span class="small muted">Statut enregistr\u00e9</span>${payBadge(r.payment)}</div><p class="tiny muted mt16">${r.payment==='unpaid'?'\u00c0 r\u00e9gler uniquement si vous participez. Aucun paiement ni engagement financier en ligne.':'Ce statut est renseign\u00e9 par les administrateurs.'} Vous seul et les administrateurs voyez cette information.</p></section>${isAdmin()?`<section class="card pad"><div class="card-heading"><h2>Fil de la s\u00e9ance</h2>${badge('Admin','blue')}</div>${s.log.slice(0,4).map(l=>`<div class="log-item"><p>${h(l.text)}</p><small>${h(M.member(db,l.actor).firstName)} \u00b7 ${h(fmtStamp(l.at))}</small></div>`).join('')||'<p class="small muted">Aucune modification pour le moment.</p>'}</section>`:''}</div></div>`;}
  function searchBox(value,change,placeholder='Rechercher un adh\u00e9rent'){return `<div class="searchbox">${icon('search')}<input type="search" value="${h(value)}" placeholder="${h(placeholder)}" aria-label="${h(placeholder)}" data-input="${change}" id="search-${change}"></div>`;}
  function matches(m,q){return fullName(m).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase());}
  function personCell(m,showLevel=false){return `<div class="person-cell">${avatar(m.id)}<div><div class="person-name">${h(fullName(m))}${m.id===ui.actor?' <span class="muted tiny">(moi)</span>':''}</div><div class="person-sub">${showLevel?h(m.level)+(m.preparing?' \u00b7 Pr\u00e9pa '+h(m.preparing):''):h(roleLabel(m))}</div></div></div>`;}
  function participantsView(s){
    const shown=db.members.filter(m=>(ui.participantFilter==='all'||M.response(s,m.id).rsvp===ui.participantFilter)&&matches(m,ui.participantSearch));
    return `<div class="toolbar"><div class="segmented" role="group" aria-label="Filtrer les r\u00e9ponses">${[['all','Tous'],['yes','Oui'],['maybe','Peut-\u00eatre'],['no','Non'],['unanswered','Sans r\u00e9ponse']].map(([v,l])=>`<button data-action="participant-filter" data-value="${v}" class="${v===ui.participantFilter?'active':''}">${h(l)}</button>`).join('')}</div>${searchBox(ui.participantSearch,'participants')}</div><section class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>ADH\u00c9RENT</th><th>R\u00c9PONSE</th><th>S\u00c9LECTION PUBLI\u00c9E</th><th>FOSSES / SAISON</th><th>TRANSPORT</th>${s.status==='closed'?'<th>PR\u00c9SENCE</th>':''}</tr></thead><tbody>${shown.map(m=>`<tr><td>${personCell(m,true)}</td><td>${rsvpBadge(M.response(s,m.id).rsvp)}</td><td>${selectedBadge(s,m.id)}</td><td class="number-cell">${M.seasonCount(db,m.id,M.seasonOf(s.date))}</td><td class="small-cell">${h(rideSummary(s,m.id))}</td>${s.status==='closed'?`<td>${badge(attendanceLabel[M.response(s,m.id).attendance],M.response(s,m.id).attendance==='dived'?'green':'')}</td>`:''}</tr>`).join('')||'<tr><td colspan="6">Aucun adh\u00e9rent ne correspond \u00e0 ce filtre.</td></tr>'}</tbody></table></div><div class="table-footer">${shown.length} adh\u00e9rent${shown.length>1?'s':''} \u00b7 Les r\u00e9ponses et la s\u00e9lection publi\u00e9e sont visibles par tous. Les paiements des autres ne le sont pas.</div></section>`;

  function transportView(s){

      return `<section class="card car-card"><div class="row between"><span class="car-icon">${icon('car')}</span>${badge(remaining?remaining+' place'+(remaining>1?'s':'')+' libre'+(remaining>1?'s':''):'Complet',remaining?'teal':'')}</div><div class="driver">${avatar(driver.id,'lg')}<div><h3>${h(fullName(driver))}</h3><div class="tiny muted mt8">Conducteur \u00b7 ${car.seats} places passagers</div></div></div>${M.selectionState(s,driver.id)!=='selected'?`<div class="banner" style="margin:4px 0 0">${icon('clock')}<span>Conducteur en attente de confirmation.</span></div>`:''}<div class="seat-list">${ps.map(id=>`<div class="seat">${avatar(id,'sm')}<span>${h(fullName(M.member(db,id)))}</span>${id===ui.actor?'<span class="ride-self-tag">Moi</span>':M.selectionState(s,id)!=='selected'?'<span class="ride-self-tag muted">En attente</span>':''}</div>`).join('')}${Array.from({length:remaining},()=>`<div class="seat empty-seat"><span class="seat-dot">${icon('plus')}</span>Une place pour vous ?</div>`).join('')}</div><p class="ride-note">${icon('location')} ${h(car.meeting||'Rendez-vous \u00e0 convenir')}${car.time?' \u00b7 '+fmtTime(car.time):''}${car.note?'<br>'+h(car.note):''}</p>${mine?`<button class="btn soft" data-action="offer-car" data-sid="${s.id}" ${!allowed?'disabled':''}>${icon('edit')}Modifier ma proposition</button><button class="text-btn mt12" style="justify-content:center;color:var(--muted)" data-action="remove-car" data-sid="${s.id}" ${!allowed?'disabled':''}>Retirer ma voiture</button>`:aboard?`<button class="btn soft" data-action="transport-mode" data-sid="${s.id}" data-value="needs" ${!allowed?'disabled':''}>${icon('check')}Je suis inscrit \u00b7 Quitter</button>`:`<button class="btn ${remaining?'primary':''}" data-action="join-car" data-sid="${s.id}" data-driver="${car.driverId}" ${!allowed||!remaining?'disabled':''}>${remaining?'Rejoindre ce trajet':'Voiture compl\u00e8te'} ${remaining?icon('arrow'):''}</button>`}</section>`;
    }).join('')}</div>`:`<section class="card empty"><div class="empty-icon">${icon('car')}</div><h3>Le premier trajet attend son conducteur</h3><p>Vous venez en voiture ? Proposez vos places pour aider les autres adh\u00e9rents.</p></section>`}`;

  function groupsView(s){

blier cette organisation.</p></section>`}`;
  }
  function manageView(s){

  }
  function selectionView(s){
    let members=db.members.filter(m=>(ui.adminAll||['yes','maybe'].includes(M.response(s,m.id).rsvp))&&matches(m,ui.adminSearch));
    if(ui.sortByCount)members.sort((a,b)=>M.seasonCount(db,a.id,M.seasonOf(s.date))-M.seasonCount(db,b.id,M.seasonOf(s.date))||fullName(a).localeCompare(fullName(b),'fr'));
    const draftCount=M.selectedIds(s,true).length,publishedCount=M.selectedIds(s).length,changes=M.draftChanges(s),closed=s.status==='closed';

      const r=M.response(s,m.id),value=(s.draftSelection||s.publishedSelection)[m.id]||'waiting',different=s.draftSelection&&(s.draftSelection[m.id]||'waiting')!==(s.publishedSelection[m.id]||'waiting');
      return `<tr data-member="${m.id}"><td>${personCell(m,true)}</td><td class="number-cell">${M.seasonCount(db,m.id,M.seasonOf(s.date))}</td><td><select data-change="admin-rsvp" data-sid="${s.id}" data-target="${m.id}" aria-label="R\u00e9ponse de ${h(fullName(m))}" ${closed?'disabled':''}>${options(Object.entries(rsvpLabel),r.rsvp)}</select></td><td class="small-cell">${h(rideSummary(s,m.id))}</td><td><select class="${different?'changed':''}" data-change="selection" data-sid="${s.id}" data-target="${m.id}" aria-label="S\u00e9lection de ${h(fullName(m))}" ${closed||!['yes','maybe'].includes(r.rsvp)?'disabled':''}><option value="selected" ${value==='selected'?'selected':''} ${r.rsvp!=='yes'?'disabled':''}>Confirm\u00e9</option><option value="waiting" ${value==='waiting'?'selected':''}>En attente</option><option value="declined" ${value==='declined'?'selected':''}>Non retenu</option></select></td><td><select data-change="payment" data-sid="${s.id}" data-target="${m.id}" aria-label="Paiement de ${h(fullName(m))}">${options(Object.entries(paymentLabel),r.payment)}</select></td></tr>`;
    }).join('')||'<tr><td colspan="6">Aucun adh\u00e9rent ne correspond \u00e0 ce filtre.</td></tr>'}</tbody></table></div><div class="table-footer">${members.length} adh\u00e9rents affich\u00e9s \u00b7 R\u00e9ponses et paiements enregistr\u00e9s imm\u00e9diatement. Seule la s\u00e9lection attend votre publication.</div></section>${!closed?`<div class="draft-bar"><div><p>${changes?`${changes} modification${changes>1?'s':''} non publi\u00e9e${changes>1?'s':''}`:s.publishedAt?'La s\u00e9lection publi\u00e9e est \u00e0 jour':'Aucune s\u00e9lection publi\u00e9e'}</p><small>${changes?'Brouillon conserv\u00e9 sur cet appareil \u00b7 les adh\u00e9rents voient toujours la derni\u00e8re publication.':'Vous pouvez ajuster la capacit\u00e9 en modifiant la s\u00e9ance.'}</small></div><div class="row gap8"><button class="btn" data-action="discard-draft" data-sid="${s.id}" ${!changes?'disabled':''}>Annuler le brouillon</button><button class="btn primary" data-action="publish" data-sid="${s.id}" ${!changes&&s.publishedAt?'disabled':''}>${icon('publish')}Publier la s\u00e9lection</button></div></div>`:''}`;
  }
  function attendanceView(s){
    const selected=M.selectedIds(s),past=M.isPast(s),closed=s.status==='closed',shown=db.members.filter(m=>ui.attendanceAll||selected.includes(m.id)||M.response(s,m.id).attendance==='dived');
    const recorded=Object.values(s.responses).filter(r=>r.attendance==='dived').length,unknown=selected.filter(id=>M.response(s,id).attendance==='unknown').length;
    return `${!past?`<div class="banner info">${icon('clock')}<span>Les pr\u00e9sences se renseignent apr\u00e8s la fin du cr\u00e9neau. Pour tester cette partie de la V0, ouvrez l\u2019une des s\u00e9ances fictives de septembre depuis l\u2019historique.</span></div>`:''}<section class="manage-summary"><div><h3>${closed?'Bilan cl\u00f4tur\u00e9':'Le bilan de la s\u00e9ance'}</h3><p class="tiny muted mt8">${recorded} personne${recorded>1?'s':''} ayant plong\u00e9 \u00b7 ${unknown} pr\u00e9sence${unknown>1?'s':''} \u00e0 renseigner</p><p class="tiny muted mt8">${closed?'Ces plong\u00e9es alimentent les compteurs de la saison '+seasonLabel(M.seasonOf(s.date))+'.':'Les compteurs seront actualis\u00e9s apr\u00e8s la cl\u00f4ture du bilan.'}</p></div><div class="row wrap gap8">${closed?`<button class="btn" data-action="reopen" data-sid="${s.id}">${icon('edit')}Rouvrir le bilan</button>`:`<button class="btn" data-action="mark-all-dived" data-sid="${s.id}" ${!past||!selected.length?'disabled':''}>Tous les confirm\u00e9s ont plong\u00e9</button><button class="btn primary" data-action="close-session" data-sid="${s.id}" ${!past?'disabled':''}>${icon('check')}Cl\u00f4turer le bilan</button>`}</div></section><div class="toolbar"><label class="checkbox-label"><input type="checkbox" data-change="attendance-all" ${ui.attendanceAll?'checked':''}>Tous les adh\u00e9rents (pour ajouter un remplacement de derni\u00e8re minute)</label></div><section class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>ADH\u00c9RENT</th><th>S\u00c9LECTION</th><th>PR\u00c9SENCE R\u00c9ELLE</th><th>PAIEMENT</th></tr></thead><tbody>${shown.map(m=>`<tr data-member="${m.id}"><td>${personCell(m,true)}</td><td>${selectedBadge(s,m.id)}</td><td><select data-change="attendance" data-sid="${s.id}" data-target="${m.id}" aria-label="Pr\u00e9sence de ${h(fullName(m))}" ${!past||closed?'disabled':''}>${options(Object.entries(attendanceLabel),M.response(s,m.id).attendance)}</select></td><td><select data-change="payment" data-sid="${s.id}" data-target="${m.id}" aria-label="Paiement de ${h(fullName(m))}">${options(Object.entries(paymentLabel),M.response(s,m.id).payment)}</select></td></tr>`).join('')||'<tr><td colspan="4">Aucun participant confirm\u00e9 pour le moment.</td></tr>'}</tbody></table></div><div class="table-footer">\u00ab A plong\u00e9 \u00bb compte pour une fosse. \u00ab Absent \u00bb et \u00ab N\u2019a pas plong\u00e9 \u00bb ne comptent pas. Aucune facturation automatique en cas d\u2019absence.</div></section>`;
  }
  function membersPage(){const shown=db.members.filter(m=>matches(m,ui.memberSearch));return `<div class="page-heading"><div><div class="eyebrow">Les visages du club</div><h1>Les adh\u00e9rents</h1><p>${db.members.length} profils fictifs pour tester la vie du club.</p></div>${seasonSelect()}</div><div class="toolbar">${searchBox(ui.memberSearch,'members')}<span class="tiny muted">Les coordonn\u00e9es restent priv\u00e9es (adh\u00e9rent concern\u00e9 et admins).</span></div><section class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>ADH\u00c9RENT</th><th>NIVEAU</th><th>NIVEAU PR\u00c9PAR\u00c9</th><th>FOSSES ${seasonLabel(ui.season)}</th>${isAdmin()?'<th>FIN CACI</th>':''}<th>R\u00d4LE</th>${isAdmin()?'<th>PROFIL</th>':''}</tr></thead><tbody>${shown.map(m=>`<tr><td>${personCell(m)}</td><td>${h(m.level||'\u00c0 renseigner')}</td><td class="small-cell">${h(m.preparing||'\u2014')}</td><td class="number-cell">${M.seasonCount(db,m.id,ui.season)}</td>${isAdmin()?`<td class="small-cell">${m.caciExpiry?h(fmtDate(m.caciExpiry,{day:'2-digit',month:'2-digit',year:'numeric'})):'\u2014'}</td>`:''}<td>${roleBadge(m)}</td>${isAdmin()?`<td><button class="icon-btn" data-action="edit-member" data-target="${m.id}" aria-label="Modifier le profil de ${h(fullName(m))}">${icon('edit')}</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${isAdmin()?7:5}">Aucun adh\u00e9rent trouv\u00e9.</td></tr>`}</tbody></table></div><div class="table-footer">${shown.length} profils \u00b7 Le niveau de plong\u00e9e et les droits administrateur sont distincts.${isAdmin()?' \u00b7 La date de fin de CACI est visible uniquement ici par les administrateurs.':''}</div></section>`;}
  function memberFields(m,adminEdit=false){const hasCar=!!m.hasUsualCar;return `<div class="form-grid"><div class="field"><label for="firstName">Pr\u00e9nom <span class="required">*</span></label><input id="firstName" name="firstName" required maxlength="100" value="${h(m.firstName)}" autocomplete="given-name"></div><div class="field"><label for="lastName">Nom <span class="required">*</span></label><input id="lastName" name="lastName" required maxlength="100" value="${h(m.lastName)}" autocomplete="family-name"></div><div class="field"><label for="email">Adresse email <span class="required">*</span></label><input id="email" name="email" type="email" required maxlength="120" value="${h(m.email)}" autocomplete="email"><small>Une adresse de test suffit : aucun email n\u2019est envoy\u00e9.</small></div><div class="field"><label for="phone">T\u00e9l\u00e9phone</label><input id="phone" name="phone" type="tel" maxlength="30" value="${h(m.phone)}" placeholder="Facultatif" autocomplete="tel"></div><div class="field"><label for="level">Niveau actuel</label><select id="level" name="level">${options(['D\u00e9butant','N1','N2','N3','N4','E1','E2','MF1','MF2','Autre'].map(v=>[v,v]),m.level)}</select></div><div class="field"><label for="preparing">Niveau pr\u00e9par\u00e9</label><select id="preparing" name="preparing">${options([['','Aucun / non renseign\u00e9'],...['N1','N2','N3','N4','E1','E2','MF1','MF2','Autre'].map(v=>[v,v])],m.preparing)}</select></div>${adminEdit?`<div class="field"><label for="caciExpiry">Fin de validit\u00e9 CACI</label><input type="date" id="caciExpiry" name="caciExpiry" value="${h(m.caciExpiry||'')}"><small>Date uniquement, sans stockage du certificat.</small></div>`:''}<div class="field span2"><label class="checkbox-label"><input type="checkbox" name="hasUsualCar" data-change="usual-car-toggle" ${hasCar?'checked':''}>Je peux habituellement proposer une voiture pour les fosses</label><small>Facultatif. Vous pourrez toujours proposer ponctuellement une voiture sur une s\u00e9ance.</small></div><div id="usual-car-fields" class="span2 ${hasCar?'':'hide'}"><div class="form-grid compact"><div class="field"><label for="usualSeats">Places passagers habituelles</label><input type="number" id="usualSeats" name="usualSeats" min="1" max="8" step="1" value="${hasCar?m.usualSeats||3:3}"><small>Hors conducteur.</small></div><div class="field"><label for="usualMeeting">Lieu de rendez-vous habituel</label><input id="usualMeeting" name="usualMeeting" maxlength="200" value="${h(hasCar?m.usualMeeting||'':'')}" placeholder="Ex. Place d'Italie, sortie du m\u00e9tro"><small>Ces valeurs servent uniquement de pr\u00e9remplissage et restent modifiables pour chaque s\u00e9ance.</small></div></div></div></div>`;}
  function profilePage(){const m=me();return `<div class="page-heading"><div><div class="eyebrow">Mon espace</div><h1>Mon profil</h1><p>Les informations utiles pour plonger ensemble.</p></div></div><div class="banner info">${icon('shield')}<span>Vous testez un profil fictif. N\u2019ajoutez pas de document de sant\u00e9, de licence ou de donn\u00e9es personnelles r\u00e9elles dans cette d\u00e9monstration.</span></div><div class="profile-grid"><aside class="card profile-summary">${avatar(m.id,'xl')}<h2>${h(fullName(m))}</h2><p>${h(m.level)}</p>${roleBadge(m)}<hr><div class="big-number">${M.seasonCount(db,m.id,ui.season)}</div><p>fosses cette saison</p><p class="tiny">Septembre ${ui.season} \u2192 ao\u00fbt ${Number(ui.season)+1}</p></aside><form class="card profile-form" id="profile-form" data-target="${m.id}"><div class="card-heading"><h2>Mes informations</h2>${icon('user')}</div><div id="profile-error"></div>${memberFields(m)}<div class="form-actions"><button type="submit" class="btn primary">${icon('save')}Enregistrer mon profil</button></div></form></div>`;}
  function render(){
    const route=currentRoute();let body,page=route.page;
    if(page==='members'&&!isAdmin()){page='home';body=home();}
    else if(page==='home')body=home();else if(page==='sessions')body=sessions();else if(page==='members')body=membersPage();else if(page==='profile')body=profilePage();else if(page==='session'){
      const s=db.sessions.find(s=>s.id===route.sid);body=s?sessionPage(s,route.tab):'<div class="card empty"><h2>S\u00e9ance introuvable</h2><button class="btn mt16" data-action="navigate" data-route="sessions">Retour au calendrier</button></div>';
    }else{page='home';body=home();}
    $('#app').innerHTML=shell(body,page);document.title=page==='session'?'S\u00e9ance \u00b7 iFosse':'iFosse \u2014 Les fosses, simplement.';
  }
  function openModal(title,subtitle,body,actions='',wide=false){
    if(!$('#modal-root').firstChild)modalReturnFocus=document.activeElement;
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description" tabindex="-1"><header class="modal-header"><div><h2 id="dialog-title">${h(title)}</h2><p id="dialog-description">${h(subtitle)}</p></div><button class="icon-btn" data-action="close-modal" aria-label="Fermer la fen\u00eatre">${icon('close')}</button></header><div class="modal-body">${body}</div>${actions?`<footer class="modal-actions">${actions}</footer>`:''}</section></div>`;
    $('#app').inert=true;document.body.style.overflow='hidden';
    requestAnimationFrame(()=>{const body=$('.modal-body'),dialog=$('.modal');if(!body||!dialog)return;const focus=$('input:not([type=checkbox]),select,button',body)||dialog;focus.focus();});
  }
  function closeModal(){ $('#modal-root').innerHTML='';$('#app').inert=false;document.body.style.overflow='';confirmCallback=null;if(modalReturnFocus&&modalReturnFocus.isConnected)modalReturnFocus.focus(); }
  function confirmDialog(title,text,fn,label='Confirmer',danger=false){
    confirmCallback=fn;
    openModal(title,'V\u00e9rifiez ce changement avant de continuer.',`<p class="explanation" style="white-space:pre-line">${h(text)}</p>`,`<button class="btn" data-action="close-modal">Annuler</button><button class="btn ${danger?'danger':'primary'}" data-action="confirm-yes">${h(label)}</button>`);
  }
  function personaDialog(){
    const presidentMember=db.members.find(m=>M.roleOf(m)==='president'),adminMember=db.members.find(m=>M.roleOf(m)==='admin'),regularMember=db.members.find(m=>M.roleOf(m)==='member'),shortcuts=[presidentMember,adminMember,regularMember].filter(Boolean);
    openModal('Changer de point de vue','Ces profils sont fictifs. Il ne s\u2019agit pas d\u2019une vraie connexion.',`${shortcuts.map(m=>`<button class="persona-option ${ui.actor===m.id?'active':''}" data-action="switch-actor" data-target="${m.id}">${avatar(m.id,'lg')}<div><strong>${h(fullName(m))}</strong><div class="role-label">${M.roleOf(m)==='president'?'Pr\u00e9sident \u00b7 administration + gestion des droits':M.roleOf(m)==='admin'?'Administrateur \u00b7 s\u00e9lections, paiements, bilans':'Adh\u00e9rent \u00b7 inscription, covoiturage, mon paiement'}</div></div>${icon(M.isAdminMember(m)?'shield':'user')}</button>`).join('')}<hr><label for="persona-select">Ou tester avec un autre adh\u00e9rent</label><select id="persona-select" class="persona-picker" data-change="persona">${options(db.members.map(m=>[m.id,fullName(m)+' \u00b7 '+roleLabel(m)]),ui.actor)}</select><p class="explanation mt16">La V0 simule les droits dans l\u2019interface. Les donn\u00e9es et les brouillons restent stock\u00e9s dans ce navigateur. Une vraie authentification et des droits c\u00f4t\u00e9 serveur seront n\u00e9cessaires pour le club.</p>`);
  }
  function switchActor(target){
    if(!db.members.some(m=>m.id===target))return;closeModal();ui.actor=target;

    if(action==='discard-draft'){
      confirmDialog('Annuler le brouillon ?', 'La derni\u00e8re s\u00e9lection publi\u00e9e sera conserv\u00e9e. Les changements non publi\u00e9s seront perdus.',()=>commit(d=>M.discardDraft(d,sid,ui.actor),'Brouillon annul\u00e9.'),'Annuler le brouillon');return;
    }
    if(action==='edit-groups'){groupDialog(sid);return;}
    if(action==='mark-all-dived'){
      const s=M.session(db,sid);confirmDialog('Valider les pr\u00e9sences des confirm\u00e9s ?', `Les ${M.selectedIds(s).length} participants confirm\u00e9s seront marqu\u00e9s \u00ab A plong\u00e9 \u00bb. Vous pourrez ensuite corriger les absences avant de cl\u00f4turer le bilan.`,()=>commit(d=>M.selectedIds(M.session(d,sid)).forEach(id=>M.setAttendance(d,sid,ui.actor,id,'dived')),'Pr\u00e9sences renseign\u00e9es. V\u00e9rifiez-les avant de cl\u00f4turer.'),'Valider ces pr\u00e9sences');return;
    }
    if(action==='close-session'){
      confirmDialog('Cl\u00f4turer le bilan ?', 'Seules les personnes marqu\u00e9es \u00ab A plong\u00e9 \u00bb seront comptabilis\u00e9es dans la saison. Toutes les pr\u00e9sences des participants confirm\u00e9s doivent \u00eatre renseign\u00e9es. Les inscriptions seront ferm\u00e9es.',()=>commit(d=>M.closeSession(d,sid,ui.actor),'Bilan cl\u00f4tur\u00e9. Les compteurs de saison sont actualis\u00e9s.'),'Cl\u00f4turer');return;
    }
    if(action==='reopen'){
      confirmDialog('Rouvrir ce bilan ?', 'Cette s\u00e9ance ne sera plus comptabilis\u00e9e dans les compteurs de saison tant que vous ne l\u2019aurez pas de nouveau cl\u00f4tur\u00e9e. Les pr\u00e9sences existantes seront conserv\u00e9es.',()=>commit(d=>M.reopenSession(d,sid,ui.actor),'Bilan rouvert pour correction.'),'Rouvrir le bilan');return;
    }
    if(action==='calendar'){exportCalendar(sid);return;}
    if(action==='csv'){exportCSV(sid);return;}
    if(action==='export-json'){exportJSON();return;}
    if(action==='import-json'){if(isAdmin())$('#backup-input').click();return;}
    if(action==='reset-demo'){
      if(!isAdmin())return;confirmDialog('Recommencer la d\u00e9monstration ?', 'Vos modifications locales seront remplac\u00e9es par les donn\u00e9es fictives de d\u00e9part. Exportez une sauvegarde JSON auparavant pour conserver vos essais.',()=>{
        ui.actor='m01';ui.season=2026;commit(d=>{for(const k of Object.keys(d))delete d[k];Object.assign(d,M.createSeed());},'D\u00e9monstration r\u00e9initialis\u00e9e.');navigate('home');
      },'R\u00e9initialiser',true);return;
    }
  }
  function onChange(event){
    const el=event.target,key=el.dataset.change;if(!key)return;
    const {sid,target}=el.dataset,value=el.value;
    if(key==='persona'){switchActor(value);return;}
    if(key==='season'){ui.season=Number(value);render();return;}
    if(key==='admin-all'){ui.adminAll=el.checked;render();return;}
    if(key==='attendance-all'){ui.attendanceAll=el.checked;render();return;}
    if(key==='usual-car-toggle'){
      const fields=document.getElementById('usual-car-fields');
      if(fields)fields.classList.toggle('hide',!el.checked);
      if(el.checked){const seats=document.getElementById('usualSeats');if(seats&&!Number(seats.value))seats.value='3';}
      return;
    }
    if(key==='group-assignment'){
      const form=document.getElementById('groups-form');
      if(form){const session=M.session(db,form.dataset.sid);liveGroupSummary(form,M.selectedIds(session));}
      return;
    }
    if(key==='admin-rsvp'){requestRsvp(sid,target,value);return;}
    if(key==='selection'){commit(d=>M.setDraftSelection(d,sid,ui.actor,target,value),null);return;}
    if(key==='payment'){commit(d=>M.setPayment(d,sid,ui.actor,target,value),'Statut de paiement enregistr\u00e9.');return;}
    if(key==='attendance'){commit(d=>M.setAttendance(d,sid,ui.actor,target,value),'Pr\u00e9sence enregistr\u00e9e.');return;}
  }
  function onInput(event){const el=event.target,key=el.dataset.input;if(!key)return;const map={members:'memberSearch',participants:'participantSearch',admin:'adminSearch'};if(!map[key])return;ui[map[key]]=el.value;const cursor=el.selectionStart,id=el.id;render();const replacement=document.getElementById(id);if(replacement){replacement.focus();try{replacement.setSelectionRange(cursor,cursor);}catch(e){}}}
  async function importFile(event){
    const file=event.target.files[0];event.target.value='';if(!file||!isAdmin())return;
    try{
      if(file.size>5*1024*1024)throw new Error('Cette sauvegarde est trop volumineuse (maximum 5 Mo).');
      const candidate=M.migrateRoles(JSON.parse(await file.text()));M.validate(candidate);
      confirmDialog('Importer cette sauvegarde ?', `${candidate.members.length} adh\u00e9rents et ${candidate.sessions.length} s\u00e9ances remplaceront les donn\u00e9es de cette d\u00e9monstration. L\u2019import ne les envoie sur aucun serveur.`,()=>{
        const priorActor=ui.actor;if(!candidate.members.some(m=>m.id===ui.actor))ui.actor=(candidate.members.find(m=>M.isAdminMember(m))||candidate.members[0]).id;
        const result=commit(d=>{for(const k of Object.keys(d))delete d[k];Object.assign(d,M.clone(candidate));},'Sauvegarde import\u00e9e.');
        if(!result.ok)ui.actor=priorActor;else{ui.season=M.seasonOf(db.sessions[0]?.date||'2026-09-01');navigate('home');}
      },'Importer la sauvegarde');
    }catch(e){toast(e.message||'La sauvegarde n\u2019a pas pu \u00eatre import\u00e9e.',true);}
  }
  document.addEventListener('click',onAction);
  document.addEventListener('change',onChange);
  document.addEventListener('input',onInput);
  document.addEventListener('submit',onForm);
  $('#backup-input').addEventListener('change',importFile);
  $('#modal-root').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop')){closeModal();render();}});
  document.addEventListener('keydown',e=>{
    if(!$('.modal'))return;
    if(e.key==='Escape'){closeModal();render();return;}
    if(e.key==='Tab'){
      const nodes=$$('a[href],button:not(:disabled),input:not(:disabled):not([type=hidden]),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]',$('.modal')).filter(n=>n.getClientRects().length);
      if(!nodes.length){e.preventDefault();return;}const first=nodes[0],last=nodes[nodes.length-1];
      if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('.modal'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
  window.addEventListener('hashchange',()=>{closeModal();render();});
  window.addEventListener('storage',e=>{
    if(e.key!==KEY||!e.newValue)return;
    try{const incoming=JSON.parse(e.newValue);M.validate(incoming);db=incoming;if(!db.members.some(m=>m.id===ui.actor))ui.actor=db.members[0].id;closeModal();render();toast('La d\u00e9monstration a \u00e9t\u00e9 mise \u00e0 jour dans un autre onglet.');}catch(err){toast('La mise \u00e0 jour d\u2019un autre onglet est invalide.',true);}
  });
  render();
  if(!storageIssue){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){storageIssue='Ce navigateur refuse la sauvegarde locale. Exportez vos essais en JSON avant de fermer la page.';render();}}
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.IFOSSE_STANDALONE){
    navigator.serviceWorker.register('./sw.js').catch(()=>{/* Offline installation is optional; the UI remains fully usable. */});
  }
})();

</script>
</body>
</html>
